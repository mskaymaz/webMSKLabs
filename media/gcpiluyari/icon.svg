<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Arka Plan / Kutu -->
  <rect width="128" height="128" rx="28" fill="#0f172a" />
  <rect x="4" y="4" width="120" height="120" rx="24" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  
  <!-- Pil Gövdesi -->
  <g filter="url(#shadow)">
    <!-- Pil Kutup Başlığı (Artı Uç) -->
    <rect x="52" y="22" width="24" height="8" rx="3" fill="#64748b" />
    
    <!-- Pil Ana Çerçeve -->
    <rect x="34" y="28" width="60" height="76" rx="12" fill="none" stroke="#64748b" stroke-width="5" />
    
    <!-- Pil Doluluk Seviyesi (Yeşil Enerji) -->
    <rect x="40" y="48" width="48" height="50" rx="8" fill="url(#bgGrad)" />
    
    <!-- Şarj Yıldırımı -->
    <path d="M68 36 L52 64 L64 64 L58 92 L78 60 L66 60 Z" fill="url(#boltGrad)" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round" />
  </g>
</svg>
