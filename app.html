<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">MSK Labs - Uygulama Detayı</title>
  <meta id="pageDesc" name="description" content="MSK Labs mobil ve masaüstü yazılım uygulaması detay ve indirme sayfası.">

  <!-- OpenGraph Dynamic Meta Tags for Social Media (WhatsApp, X, Facebook) -->
  <meta id="ogTitle" property="og:title" content="MSK Labs Uygulaması">
  <meta id="ogDesc" property="og:description" content="MSK Labs reklamsız ve ücretsiz yazılımları.">
  <meta id="ogImage" property="og:image" content="img/MSKLabsLogo.svg">
  <meta property="og:type" content="website">

  <meta name="theme-color" content="#0f172a">
  <script>!function(){var t=localStorage.getItem("user_theme")||(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");"dark"===t&&document.documentElement.setAttribute("data-theme","dark")}()</script>

  <link rel="stylesheet" href="assets/css/global.css?v=25">
  <style>
    .app-hero-card {
      background: var(--bg-card, #ffffff);
      color: var(--text-main);
      border: 1px solid var(--border-color, #cbd5e1);
      border-radius: 16px;
      padding: clamp(1.25rem, 4vw, 2rem);
      margin-bottom: 2rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }
    .app-header-flex {
      display: flex;
      gap: 1.5rem;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .app-big-icon {
      font-size: 3.5rem;
      width: 90px;
      height: 90px;
      border-radius: 20px;
      background: var(--bg-surface, linear-gradient(135deg, #f1f5f9, #e2e8f0));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.8), 0 4px 12px rgba(0,0,0,0.06);
    }
    .app-meta-pills {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
      flex-wrap: wrap;
    }
    .meta-pill {
      background: var(--bg-surface, #f1f5f9);
      color: var(--text-main, #334155);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border-color, #e2e8f0);
    }
    @media (max-width: 600px) {
      .app-hero-card {
        padding: 1.25rem;
      }
      .app-header-flex {
        gap: 1rem;
      }
      .app-big-icon {
        width: 70px;
        height: 70px;
        font-size: 2.8rem;
      }
    }
    .feature-list {
      list-style: none;
      padding: 0;
      margin: 1.5rem 0;
    }
    .feature-list li {
      padding: 0.5rem 0;
      border-bottom: 1px dashed #e2e8f0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #334155;
      font-weight: 500;
    }
    .action-btn-group {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
      flex-wrap: wrap;
    }
    .primary-dl-btn {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
      transition: transform 0.2s;
    }
    .primary-dl-btn:hover {
      transform: translateY(-2px);
    }
    .secondary-btn {
      background: #f8fafc;
      color: #334155;
      border: 1px solid #cbd5e1;
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="site-header-inner" style="max-width: 900px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem;">
      <a href="index.html" class="bizce-center-logo-link" title="MSK Labs Ana Sayfa">
        <img src="img/MSKLabsLogo.svg" alt="MSK Labs Logo" class="site-header-logo" style="height: 55px; width: auto;">
      </a>

      <div class="lang-switcher" style="display: flex; gap: 10px; align-items: center;">
        <button onclick="setLang('tr')" data-lang="tr" class="active" title="Türkçe" style="font-size: 0.84rem; padding: 3px 8px;">TR</button>
        <button onclick="setLang('en')" data-lang="en" title="English" style="font-size: 0.84rem; padding: 3px 8px;">EN</button>
        <button onclick="setLang('ar')" data-lang="ar" title="العربية" class="lang-btn-arabic" style="font-size: 0.84rem; padding: 3px 8px;">
          <img src="img/ElArabiye.svg" alt="العربية" class="arabic-btn-icon" style="height: 22px;">
        </button>
      </div>
    </div>
  </header>

  <!-- Standart Ust Ana Navigasyon Menusu -->
  <nav class="top-main-nav">
    <a href="index.html"><span class="lang-tr">Ana Sayfa</span><span class="lang-en">Home</span><span class="lang-ar">الرئيسية</span></a>
    <a href="blog/blog.html?type=bizce"><span class="lang-tr">Bizce</span><span class="lang-en">Bizce</span><span class="lang-ar">بيزجه</span></a>
    <a href="blog/blog.html?type=anilts"><span class="lang-tr">Anıltılar</span><span class="lang-en">Anıltılar</span><span class="lang-ar">Anıltılar</span></a>
    <a href="index.html#apps"><span class="lang-tr">Uygulamalarımız</span><span class="lang-en">Our Apps</span><span class="lang-ar">تطبيقاتنا</span></a>
    <a href="about.html"><span class="lang-tr">Hakkımızda</span><span class="lang-en">About Us</span><span class="lang-ar">عن الشركة</span></a>
    <a href="destek.html"><span class="lang-tr">Destek &amp; Talep</span><span class="lang-en">Support &amp; Feedback</span><span class="lang-ar">الدعم والطلبات</span></a>
    <a href="contact.html"><span class="lang-tr">İletişim</span><span class="lang-en">Contact</span><span class="lang-ar">اتصل بنا</span></a>
  </nav>

  <div class="layout-wrapper">
    <div class="portfolio-container">
      <div id="appContainer" class="app-hero-card">
        <!-- Dynamic Content Rendered Here -->
        <p style="text-align: center; color: #64748b;">Uygulama bilgileri yükleniyor...</p>
      </div>
      <div class="infeed-ad-container">
        <div class="ad-placeholder">Sayfa Altı Reklam Alanı (Bottom Banner)</div>
      </div>
    </div>
  </div>

  <!-- Layout Injector Footer -->
  <footer id="site-footer" class="site-footer"></footer>

  <!-- Core Scripts -->
  <script src="assets/js/apps-data.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    (function() {
      var urlParams = new URLSearchParams(window.location.search);
      var appId = urlParams.get('id') || urlParams.get('app') || 'haydinamaza';
      var app = window.MSK_APPS_DATA[appId] || window.MSK_APPS_DATA['haydinamaza'];

      var activeLang = localStorage.getItem('user_lang') || 'tr';

      window.setLang = function(lang) {
        activeLang = lang || 'tr';
        try { localStorage.setItem('user_lang', activeLang); } catch(e) {}

        document.body.className = 'lang-' + activeLang;
        if (activeLang === 'ar') {
          document.body.setAttribute('dir', 'rtl');
        } else {
          document.body.removeAttribute('dir');
        }

        var buttons = document.querySelectorAll('.lang-switcher button');
        buttons.forEach(function(btn) {
          if (btn.getAttribute('data-lang') === activeLang) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });

        renderApp();
      };

      function t(obj) {
        if (!obj) return '';
        if (typeof obj === 'string') return obj;
        return obj[activeLang] || obj['tr'] || '';
      }

      function renderApp() {
        var titleText = t(app.name) + " - MSK Labs";
        document.title = titleText;
        var pTitle = document.getElementById('pageTitle');
        if (pTitle) pTitle.innerText = titleText;
        var pDesc = document.getElementById('pageDesc');
        if (pDesc) pDesc.setAttribute('content', t(app.description));
        var ogT = document.getElementById('ogTitle');
        if (ogT) ogT.setAttribute('content', titleText);
        var ogD = document.getElementById('ogDesc');
        if (ogD) ogD.setAttribute('content', t(app.description));

        var hTitle = document.getElementById('appHeaderTitle');
        var hTagline = document.getElementById('appHeaderTagline');
        if (hTitle) hTitle.innerText = (activeLang === 'ar' ? '📱 تفاصيل التطبيق' : (activeLang === 'en' ? '📱 App Details' : '📱 Uygulama Detayı'));
        if (hTagline) hTagline.innerText = (activeLang === 'ar' ? 'برمجيات MSK Labs للهواتف والمكتب' : (activeLang === 'en' ? 'MSK Labs Mobile & Desktop Software' : 'MSK Labs Mobil & Masaüstü Yazılımları'));

        var container = document.getElementById('appContainer');
        if (!container) return;

        var featuresHTML = app.features.map(function(f) {
          return '<li>✅ ' + t(f) + '</li>';
        }).join('');

        var dlBtnText = (activeLang === 'ar' ? '📲 تحميل التطبيق' : (activeLang === 'en' ? '📲 Download App' : '📲 Uygulamayı İndir'));
        var suppBtnText = (activeLang === 'ar' ? '💬 الدعم والأسئلة الشائعة' : (activeLang === 'en' ? '💬 Support & FAQ' : '💬 Destek & SSS'));
        var changelogBtnText = (activeLang === 'ar' ? '📜 سجل التغييرات' : (activeLang === 'en' ? '📜 Version Changelog' : '📜 Sürüm Günlüğü'));
        var featTitle = (activeLang === 'ar' ? 'الميزات البارزة' : (activeLang === 'en' ? 'Highlighted Features' : 'Öne Çıkan Özellikler'));

        var iconMarkup = `<img src="media/${app.id}/icon.png" alt="${t(app.name)}">`;

        container.innerHTML = `
          <div class="app-header-flex">
            <div class="app-big-icon">${iconMarkup}</div>
            <div>
              <h1 style="margin: 0; font-size: 1.8rem; color: #0f172a;">${t(app.name)}</h1>
              <p style="margin: 0.25rem 0 0 0; color: #475569; font-weight: 600; font-size: 1rem;">${t(app.tagline)}</p>
              <div class="app-meta-pills">
                <span class="meta-pill">v${app.version}</span>
                <span class="meta-pill">${app.platform}</span>
                <span class="meta-pill">${app.rating}</span>
              </div>
            </div>
          </div>

          <p style="font-size: 1.05rem; line-height: 1.7; color: #334155;">${t(app.description)}</p>

          <h3 style="margin-top: 1.5rem; color: #0f172a;">${featTitle}</h3>
          <ul class="feature-list">
            ${featuresHTML}
          </ul>

          <div class="action-btn-group">
            <a href="${app.storeUrl}" class="primary-dl-btn">${dlBtnText}</a>
            <a href="${app.supportPage}" class="secondary-btn">${suppBtnText}</a>
            <a href="changelog.html?app=${app.id}" class="secondary-btn">${changelogBtnText}</a>
          </div>
        `;
      }

      window.setLang(activeLang);
    })();
  </script>
</body>
</html>
