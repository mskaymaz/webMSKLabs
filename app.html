  <script>
    (function() {
      var urlParams = new URLSearchParams(window.location.search);
      var appId = (urlParams.get('id') || urlParams.get('app') || urlParams.get('slug') || 'haydinamaza').toLowerCase();
      
      // Varsayılan Statik Fallback
      var fallbackApp = (window.MSK_APPS_DATA && (window.MSK_APPS_DATA[appId] || window.MSK_APPS_DATA['haydinamaza'])) || null;

      var currentApp = fallbackApp ? {
        id: appId,
        name: fallbackApp.name,
        description: fallbackApp.description,
        tagline: fallbackApp.tagline,
        features: fallbackApp.features || [],
        feature_cards: fallbackApp.feature_cards || [],
        version: fallbackApp.version || '1.0.0',
        platform: fallbackApp.platform || 'Mobil & Masaüstü',
        status: fallbackApp.status || (['haydinamaza', 'date_counter', 'rekatsay'].indexOf(appId) !== -1 ? 'active' : 'in_development'),
        category: fallbackApp.category || (appId === 'haydinamaza' ? 'islamic' : 'utility'),
        downloads_count: 0,
        icon_url: fallbackApp.icon_url || fallbackApp.logoImg || ('media/' + (fallbackApp.id || appId).replace(/_/g, '') + '/icon.png'),
        permanent_download_url: fallbackApp.storeUrl,
        store_links: {},
        versions: []
      } : null;

      var activeLang = localStorage.getItem('user_lang') || 'tr';

      window.setLang = function(lang) {
        activeLang = lang || 'tr';
        try { localStorage.setItem('user_lang', activeLang); } catch(e) {}

        document.body.className = 'lang-' + activeLang;
        if (activeLang === 'ar') {
          document.body.setAttribute('dir', 'rtl');
        } else {
          document.body.removeAttribute('dir');
        }

        var buttons = document.querySelectorAll('.lang-switcher button');
        buttons.forEach(function(btn) {
          if (btn.getAttribute('data-lang') === activeLang) {
            btn.classList.add('active');
          } else if (btn.getAttribute('data-lang')) {
            btn.classList.remove('active');
          }
        });

        if (currentApp) renderApp();
      };

      function t(obj) {
        if (!obj) return '';
        if (typeof obj === 'string') return obj;
        return obj[activeLang] || obj['tr'] || obj['en'] || '';
      }

      var contactEmail = (window.SITE_CONFIG && window.SITE_CONFIG.contactEmail) || 'msklabs.org@gmail.com';

      function updateSchema(app) {
        var schemaEl = document.getElementById('schemaScript');
        if (!schemaEl || !app) return;
        var appNameStr = t(app.name);
        var schemaData = {
          "@context": "https://schema.org",
          "@type": "SoftwareApplication",
          "name": appNameStr,
          "operatingSystem": app.platform || "Android, iOS, Web",
          "applicationCategory": "UtilitiesApplication",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          },
          "publisher": {
            "@type": "Organization",
            "name": "MSK Labs",
            "url": "https://msklabs.org/"
          }
        };
        if (app.permanent_download_url) {
          schemaData.downloadUrl = app.permanent_download_url;
        }
        if (app.description) {
          schemaData.description = t(app.description);
        }
        if (app.version) {
          schemaData.softwareVersion = app.version;
        }
        schemaEl.textContent = JSON.stringify(schemaData, null, 2);
      }

      function getPlatformBadgeInfo(p, lang) {
        var pl = (p || 'android').toLowerCase().trim();
        if (pl === 'desktop' || pl === 'windows' || pl.includes('desk') || pl.includes('win')) {
          return {
            icon: '💻',
            label: lang === 'ar' ? 'تطبيق سطح المكتب (Windows)' : (lang === 'en' ? 'Desktop App (Windows)' : 'Masaüstü Sistem (Windows)')
          };
        }
        if (pl === 'ios') {
          return {
            icon: '🍏',
            label: lang === 'ar' ? 'حل iOS' : (lang === 'en' ? 'iOS Solution' : 'iOS Çözümü')
          };
        }
        if (pl.includes('android & ios') || pl.includes('android / ios') || pl.includes('mobil & masaüstü') || pl.includes('mobil & masaustu')) {
          return {
            icon: '📱',
            label: lang === 'ar' ? 'المحمول (Android & iOS)' : (lang === 'en' ? 'Mobile (Android & iOS)' : 'Mobil (Android & iOS)')
          };
        }
        if (pl === 'web' || pl === 'pwa') {
          return {
            icon: '🌐',
            label: lang === 'ar' ? 'تطبيق الويب' : (lang === 'en' ? 'Web Application' : 'Web Uygulaması')
          };
        }
        if (pl === 'all') {
          return {
            icon: '📱',
            label: lang === 'ar' ? 'منصات متعددة' : (lang === 'en' ? 'Multi-Platform' : 'Çoklu Platform')
          };
        }
        return {
          icon: '📱',
          label: lang === 'ar' ? 'حل المحمول (Android)' : (lang === 'en' ? 'Mobile Solution (Android)' : 'Mobil Çözüm (Android)')
        };
      }

      function getCategoryBadgeInfo(cat, lang) {
        var c = (cat || 'utility').toLowerCase().trim();
        var catDict = {
          'utility': { icon: '🛠️', tr: 'Araçlar & Yardımcılar', en: 'Utilities & Tools', ar: 'أدوات ومساعدات' },
          'araçlar': { icon: '🛠️', tr: 'Araçlar & Yardımcılar', en: 'Utilities & Tools', ar: 'أدوات ومساعدات' },
          'islamic': { icon: '🕋', tr: 'İslami / Dinî', en: 'Islamic / Religious', ar: 'إسلامي وديني' },
          'ibadet': { icon: '🕋', tr: 'İbadet Asistanı', en: 'Worship Assistant', ar: 'مساعد العبادة' },
          'productivity': { icon: '⚡', tr: 'Üretkenlik & Takip', en: 'Productivity & Tracking', ar: 'إنتاجية ومتابعة' },
          'education': { icon: '📚', tr: 'Eğitim & İlim', en: 'Education & Knowledge', ar: 'تعليم ومعرفة' },
          'lifestyle': { icon: '🌱', tr: 'Yaşam & Sağlık', en: 'Lifestyle & Health', ar: 'نمط حياة وصحة' },
          'multimedia': { icon: '🎵', tr: 'Multimedya & Ses', en: 'Multimedia & Audio', ar: 'وسائط متعددة وصوت' },
          'ai': { icon: '🤖', tr: 'Yapay Zekâ', en: 'Artificial Intelligence', ar: 'ذكاء اصطناعي' },
          'system': { icon: '🛡️', tr: 'Sistem & Güvenlik', en: 'System & Security', ar: 'نظام وأمان' },
          'mobil': { icon: '📱', tr: 'Mobil Uygulama', en: 'Mobile Application', ar: 'تطبيق جوال' },
          'masaüstü': { icon: '💻', tr: 'Masaüstü Uygulama', en: 'Desktop Application', ar: 'تطبيق سطح المكتب' }
        };
        var match = catDict[c];
        if (match) {
          return { icon: match.icon, label: match[lang] || match.tr };
        }
        return { icon: '🏷️', label: cat || 'Araç' };
      }

      function getStatusBadgeInfo(st, lang) {
        var s = (st || 'active').toLowerCase().trim();
        if (s === 'active' || s === 'published' || s === 'yayında') {
          return {
            icon: '🚀',
            label: lang === 'ar' ? 'مباشر' : (lang === 'en' ? 'Published' : 'Yayında')
          };
        }
        if (s === 'planned' || s === 'planlanıyor') {
          return {
            icon: '📋',
            label: lang === 'ar' ? 'مخطط له' : (lang === 'en' ? 'Planned' : 'Planlanıyor')
          };
        }
        return {
          icon: '🛠️',
          label: lang === 'ar' ? 'التطوير قيد التقدم' : (lang === 'en' ? 'Development In Progress' : 'Geliştirme Devam Ediyor')
        };
      }

      function renderApp() {
        if (!currentApp) return;

        var appNameStr = t(currentApp.name);
        var titleText = appNameStr + " - MSK Labs";
        document.title = titleText;
        var pTitle = document.getElementById('pageTitle');
        if (pTitle) pTitle.innerText = titleText;
        var pDesc = document.getElementById('pageDesc');
        if (pDesc) pDesc.setAttribute('content', t(currentApp.description));
        var ogT = document.getElementById('ogTitle');
        if (ogT) ogT.setAttribute('content', titleText);
        var ogD = document.getElementById('ogDesc');
        if (ogD) ogD.setAttribute('content', t(currentApp.description));

        updateSchema(currentApp);

        var container = document.getElementById('appContainer');
        if (!container) return;

        var featTitle = (activeLang === 'ar' ? 'الميزات البارزة' : (activeLang === 'en' ? 'Highlighted Features' : 'Öne Çıkan Özellikler'));
        var changelogTitle = (activeLang === 'ar' ? 'سجل التحديثات والإصدارات' : (activeLang === 'en' ? 'Version History & Changelog' : 'Sürüm Günlüğü ve Değişiklikler'));
        var dlSectionTitle = (activeLang === 'ar' ? 'خيارات التنزيل وقنوات الإصدار' : (activeLang === 'en' ? 'Download Options & Release Channels' : 'İndirme Seçenekleri ve Yayın Kanalları'));

        // 1. Öne Çıkan Özellikler (Standart Kutu Kartlar ve Açılır Balon/Popover Desteği)
        var featuresSectionHTML = '';
        var rawCards = (Array.isArray(currentApp.feature_cards) && currentApp.feature_cards.length > 0)
          ? currentApp.feature_cards
          : (Array.isArray(currentApp.features) && currentApp.features.length > 0
            ? currentApp.features.map(function(f, i) {
                var fTitle = t(f);
                return {
                  icon: '✨',
                  title_tr: fTitle,
                  title_en: fTitle,
                  title_ar: fTitle,
                  description_tr: fTitle,
                  description_en: fTitle,
                  description_ar: fTitle
                };
              })
            : []);

        if (rawCards.length > 0) {
          window._currentCardsData = rawCards;
          var cardsHTML = rawCards.map(function(card, idx) {
            var icon = card.icon || '⭐';
            var iconHtml = (icon.startsWith('<') || icon.startsWith('http')) 
              ? `<span class="feature-box-icon">${icon.startsWith('<') ? icon : `<img src="${icon}" alt="" />`}</span>` 
              : `<span class="feature-box-icon">${icon}</span>`;
            var title = t({ tr: card.title_tr, en: card.title_en || card.title_tr, ar: card.title_ar || card.title_tr });
            var desc = t({ tr: card.description_tr || card.desc_tr, en: card.description_en || card.desc_en || card.description_tr, ar: card.description_ar || card.desc_ar || card.description_tr });

            return `
              <div class="feature-box" onclick="window.openFeatureCardPopover(${idx})" title="${activeLang === 'ar' ? 'انقر لقراءة التفاصيل كاملة' : (activeLang === 'en' ? 'Click to read full details' : 'Metnin tamamını okumak için tıklayın')}">
                <h4>${iconHtml} <span class="feature-box-title">${title}</span></h4>
                <p>${desc}</p>
              </div>
            `;
          }).join('');

          featuresSectionHTML = `
            <div class="features-title">${featTitle}</div>
            <div class="features-grid">
              ${cardsHTML}
            </div>
          `;
        }

        // 2. İkon / Logo (D1 CDN -> Local Media Fallback -> Emoji Fallback)
        var iconMarkup = currentApp.icon_url 
          ? `<img src="${currentApp.icon_url}" alt="${appNameStr}" onerror="if(!this.dataset.retry){this.dataset.retry=1;this.src='media/' + (currentApp.id || '').replace(/_/g, '') + '/icon.png';}else{this.onerror=null;this.parentNode.innerHTML='📱';}">` 
          : '📱';

        // 3. Sağ Dil Durum ve Çeviri Talep Paneli (TR, EN, AR Yalın Standart - Emojisiz Bayrak) + Hızlı İndir Butonu
        var langStatusLabel = activeLang === 'ar' ? 'حالة اللغة:' : (activeLang === 'en' ? 'Language Status:' : 'Dil Durumu:');
        var langActiveText = activeLang === 'ar' ? 'نشط' : (activeLang === 'en' ? 'Active' : 'Aktif');
        var dlBtnText = activeLang === 'ar' ? 'تنزيل التطبيق' : (activeLang === 'en' ? 'Download App' : 'Uygulamayı İndir');
        var guideBtnText = activeLang === 'ar' ? 'دليل الاستخدام (PDF)' : (activeLang === 'en' ? 'User Guide (PDF)' : 'Kullanım Kılavuzu İndir');
        var guideNotReadyMsg = activeLang === 'ar' ? 'دليل الاستخدام (PDF) قيد التجهيز وسيتم نشره قريباً.' : (activeLang === 'en' ? 'User guide (PDF) is being prepared and will be available soon.' : 'Kullanım kılavuzu (PDF) hazırlanıyor, yakında eklenecektir.');

        var guideUrl = currentApp.guide_url || currentApp.manual_url || '';
        var guideAttr = guideUrl 
          ? `href="${guideUrl}" target="_blank" download` 
          : `href="javascript:void(0)" onclick="alert('${guideNotReadyMsg}')"`;

        var langRightPanelHTML = `
          <div class="app-header-right">
            <div class="global-status-panel">
              <span>🌐 ${langStatusLabel} <strong class="status-tag active">TR (${langActiveText})</strong></span>
            </div>
        `;
        if (activeLang === 'en') {
          var enSubj = encodeURIComponent('[EN Version Request] ' + appNameStr);
          var enBody = encodeURIComponent('Hello MSK Labs Team,\n\nI would like to request the English (EN) version of ' + appNameStr + '.\n\nThank you!');
          langRightPanelHTML += `
            <a href="mailto:${contactEmail}?subject=${enSubj}&body=${enBody}" class="lab-request-btn">
              📩 Request EN Version from Lab
            </a>
            <small class="email-note">Or send email to: <strong class="contact-email-text">${contactEmail}</strong></small>
          `;
        } else if (activeLang === 'ar') {
          var arSubj = encodeURIComponent('[AR Version Request] ' + appNameStr);
          var arBody = encodeURIComponent('Hello MSK Labs Team,\n\nI would like to request the Arabic version of ' + appNameStr + '.\n\nThank you!');
          langRightPanelHTML += `
            <a href="mailto:${contactEmail}?subject=${arSubj}&body=${arBody}" class="lab-request-btn">
              📩 طلب إصدار اللغة العربية من المختبر
            </a>
            <small class="email-note">أو أرسل بريداً إلى: <strong class="contact-email-text">${contactEmail}</strong></small>
          `;
        }
        langRightPanelHTML += `
            <a href="#download-section" onclick="window.scrollToDownloadSection(event)" class="hero-download-btn">
              <span>${dlBtnText}</span>
            </a>
            <a ${guideAttr} class="hero-guide-btn" title="${guideBtnText}">
              <span>📖 ${guideBtnText}</span>
            </a>
          </div>
        `;

        // 4. İndirme ve Mağaza Kanalları Kartları
        var sl = currentApp.store_links || {};
        var downloadCards = [];

        // Google Play
        var gpUrl = sl.google_play || (currentApp.id === 'haydinamaza' || currentApp.id === 'haydi_namaza' ? 'https://play.google.com/store/apps/details?id=com.msklabs.haydinamaza' : '');
        if (gpUrl) {
          downloadCards.push(`
            <a href="${gpUrl}" target="_blank" rel="noopener noreferrer" class="download-card">
              <div class="download-card-header">
                <div class="download-card-icon"><img src="assets/img/store/google-play.png" alt="Google Play" class="store-brand-icon"></div>
                <div class="download-card-title">Google Play</div>
              </div>
              <div class="download-card-status">${activeLang === 'ar' ? 'تنزيل من متجر Google Play' : (activeLang === 'en' ? 'Get it on Google Play' : 'Play Store üzerinden edin')}</div>
              <span class="download-tag tag-active">⚡ ${activeLang === 'ar' ? 'انتقل إلى المتجر' : (activeLang === 'en' ? 'Visit Store' : 'Mağazaya Git')}</span>
            </a>
          `);
        } else {
          downloadCards.push(`
            <div class="download-card disabled">
              <div class="download-card-header">
                <div class="download-card-icon"><img src="assets/img/store/google-play.png" alt="Google Play" class="store-brand-icon"></div>
                <div class="download-card-title">Google Play</div>
              </div>
              <div class="download-card-status">${activeLang === 'ar' ? 'ستكون متاحة قريباً' : (activeLang === 'en' ? 'Will be available soon' : 'Çok yakında burada')}</div>
              <span class="download-tag tag-soon">🛠️ ${activeLang === 'ar' ? 'قيد التحضير' : (activeLang === 'en' ? 'In Progress' : 'Hazırlanıyor')}</span>
            </div>
          `);
        }

        // GitHub Direct APK
        var ghUrl = sl.github || (currentApp.id === 'haydinamaza' || currentApp.id === 'haydi_namaza' ? 'https://github.com/mskaymaz/AllApp/raw/main/releases/HaydiNamaza.apk' : '');
        if (ghUrl) {
          var isDirectApk = ghUrl.endsWith('.apk') || ghUrl.includes('/releases/');
          downloadCards.push(`
            <a href="${ghUrl}" ${isDirectApk ? 'download' : ''} target="_blank" rel="noopener noreferrer" class="download-card">
              <div class="download-card-header">
                <div class="download-card-icon"><img src="assets/img/store/github.png" alt="GitHub" class="store-brand-icon"></div>
                <div class="download-card-title">GitHub (APK)</div>
              </div>
              <div class="download-card-status">${activeLang === 'ar' ? 'تنزيل إصدار أندرويد (APK)' : (activeLang === 'en' ? 'Download Android Version (APK)' : 'Android Sürümünü İndir (APK)')}</div>
              <span class="download-tag tag-active">⚡ ${activeLang === 'ar' ? 'تنزيل مباشر' : (activeLang === 'en' ? 'Direct Download' : 'Doğrudan İndir')}</span>
            </a>
          `);
        } else {
          downloadCards.push(`
            <div class="download-card disabled">
              <div class="download-card-header">
                <div class="download-card-icon"><img src="assets/img/store/github.png" alt="GitHub" class="store-brand-icon"></div>
                <div class="download-card-title">GitHub (APK)</div>
              </div>
              <div class="download-card-status">${activeLang === 'ar' ? 'حزمة APK قيد التجهيز' : (activeLang === 'en' ? 'APK build in progress' : 'APK paketi hazırlanıyor')}</div>
              <span class="download-tag tag-soon">🛠️ ${activeLang === 'ar' ? 'قيد التحضير' : (activeLang === 'en' ? 'In Progress' : 'Hazırlanıyor')}</span>
            </div>
          `);
        }

        // Google Drive Direct APK
        var gdUrl = sl.google_drive || (currentApp.id === 'haydinamaza' || currentApp.id === 'haydi_namaza' ? 'https://drive.google.com/uc?export=download&confirm=no_antivirus&id=1nMtU6tlxZw2U7x1OM_R49_HtViIGpCGe' : '');
        if (gdUrl) {
          downloadCards.push(`
            <a href="${gdUrl}" target="_blank" rel="noopener noreferrer" class="download-card">
              <div class="download-card-header">
                <div class="download-card-icon"><img src="assets/img/store/google-drive.png" alt="Google Drive" class="store-brand-icon"></div>
                <div class="download-card-title">Google Drive (APK)</div>
              </div>
              <div class="download-card-status">${activeLang === 'ar' ? 'تنزيل بديل عبر Google Drive' : (activeLang === 'en' ? 'Alternative Google Drive Download' : 'Alternatif Google Drive İndirme')}</div>
              <span class="download-tag tag-active">⚡ ${activeLang === 'ar' ? 'تنزيل مباشر' : (activeLang === 'en' ? 'Direct Download' : 'Doğrudan İndir')}</span>
            </a>
          `);
        }

        // App Store (iOS)
        var appleNoteText = activeLang === 'ar' 
          ? 'غير متوفر حالياً بسبب الإجراءات المعقدة والصارمة لشركة Apple.' 
          : (activeLang === 'en' 
            ? 'Not available yet due to Apple\'s strict and irrational store policies.' 
            : 'Apple\'a ait katı ve anlamsız prosedürler gereği henüz hazırlanamıyor.');

        if (sl.app_store) {
          downloadCards.push(`
            <a href="${sl.app_store}" target="_blank" rel="noopener noreferrer" class="download-card">
              <div class="download-card-header">
                <div class="download-card-icon"><img src="assets/img/store/apple.svg" alt="App Store" class="store-brand-icon" style="width: 22px; height: 22px;"></div>
                <div class="download-card-title">App Store</div>
              </div>
              <div class="download-card-status">${activeLang === 'ar' ? 'متوفر على App Store' : (activeLang === 'en' ? 'Available on App Store' : 'App Store üzerinden edin')}</div>
              <span class="download-tag tag-active">⚡ ${activeLang === 'ar' ? 'انتقل إلى المتجر' : (activeLang === 'en' ? 'Visit Store' : 'Mağazaya Git')}</span>
            </a>
          `);
        } else {
          downloadCards.push(`
            <div class="download-card disabled">
              <div class="download-card-header">
                <div class="download-card-icon"><img src="assets/img/store/apple.svg" alt="App Store" class="store-brand-icon" style="width: 22px; height: 22px;"></div>
                <div class="download-card-title">App Store</div>
              </div>
              <div class="download-card-status" style="color: var(--text-muted); font-size: 0.82rem; line-height: 1.45; margin-top: 4px;">
                ${appleNoteText}
              </div>
            </div>
          `);
        }

        // Web / PWA or Windows Store
        if (sl.web_url) {
          downloadCards.push(`
            <a href="${sl.web_url}" target="_blank" rel="noopener noreferrer" class="download-card">
              <div class="download-card-header">
                <div class="download-card-icon">🌐</div>
                <div class="download-card-title">Web / PWA</div>
              </div>
              <div class="download-card-status">${activeLang === 'ar' ? 'تشغيل التطبيق في المتصفح' : (activeLang === 'en' ? 'Run app in web browser' : 'Tarayıcıda Canlı Çalıştır')}</div>
              <span class="download-tag tag-active">⚡ ${activeLang === 'ar' ? 'فتح الويب' : (activeLang === 'en' ? 'Open Web' : 'Web Vitrinini Aç')}</span>
            </a>
          `);
        }
        if (sl.windows_store) {
          downloadCards.push(`
            <a href="${sl.windows_store}" target="_blank" rel="noopener noreferrer" class="download-card">
              <div class="download-card-header">
                <div class="download-card-icon">🪟</div>
                <div class="download-card-title">Microsoft Store</div>
              </div>
              <div class="download-card-status">${activeLang === 'ar' ? 'تنزيل لنظام Windows' : (activeLang === 'en' ? 'Download for Windows' : 'Windows için İndir')}</div>
              <span class="download-tag tag-active">⚡ ${activeLang === 'ar' ? 'انتقل إلى المتجر' : (activeLang === 'en' ? 'Visit Store' : 'Mağazaya Git')}</span>
            </a>
          `);
        }

        // 5. Sürüm Geçmişi (Changelog) Kartları
        var versionsHTML = '';
        if (currentApp.versions && currentApp.versions.length > 0) {
          var items = currentApp.versions.map(function(ver) {
            var note = ver['changelog_' + activeLang] || ver.changelog_tr || 'İyileştirmeler ve hata düzeltmeleri yapıldı.';
            var dateStr = ver.released_at ? ver.released_at.split(' ')[0] : '';
            return `
              <div class="version-item">
                <div class="version-header">
                  <span style="color: var(--accent-primary, #2563eb);">v${ver.version_name}</span>
                  <span style="font-size: 0.78rem; color: var(--text-muted); font-weight: 500;">${dateStr}</span>
                </div>
                <div class="version-notes">${note}</div>
                ${ver.download_url ? `<div style="margin-top: 6px;"><a href="${ver.download_url}" style="font-size: 0.78rem; color: var(--accent-primary, #2563eb); text-decoration: none; font-weight: 600;">📥 Sürümü Doğrudan İndir (${ver.platform || 'Genel'})</a></div>` : ''}
              </div>
            `;
          }).join('');

          versionsHTML = `
            <div class="version-history-box">
              <h3 style="margin: 0 0 12px; color: var(--text-main); font-size: 1.1rem;">${changelogTitle}</h3>
              ${items}
            </div>
          `;
        }

        var platInfo = getPlatformBadgeInfo(currentApp.platform, activeLang);
        var catInfo = getCategoryBadgeInfo(currentApp.category, activeLang);
        var statusInfo = getStatusBadgeInfo(currentApp.status, activeLang);

        // 6. Birleştirilmiş Şablon Çıktısı
        container.innerHTML = `
          <div class="app-header">
            <div class="app-header-left">
              <div class="app-big-icon">${iconMarkup}</div>
              <div class="app-title-group">
                <h1>${appNameStr}</h1>
                <div class="badges">
                  <span class="badge badge-platform">${platInfo.icon} ${platInfo.label}</span>
                  <span class="badge badge-category" style="background: var(--bg-surface); color: var(--text-main); border: 1px solid var(--border-color);">${catInfo.icon} ${catInfo.label}</span>
                  <span class="badge badge-status">${statusInfo.icon} ${statusInfo.label}</span>
                  <span class="badge" style="background: var(--bg-surface); color: var(--accent-primary, #2563eb); border: 1px solid var(--border-color);">v${currentApp.version}</span>
                </div>
              </div>
            </div>
            ${langRightPanelHTML}
          </div>

          <div class="app-description">${t(currentApp.description)}</div>

          ${featuresSectionHTML}

          <div id="download-section" class="download-section">
            <div class="download-section-title">
              <span>📥 ${dlSectionTitle}</span>
            </div>
            <div class="download-grid">
              ${downloadCards.join('')}
            </div>
          </div>
          ${versionsHTML}
        `;
      }

      // 1. Önce ilk render'ı yap (varsayılan veriyle hemen göster)
      window.setLang(activeLang);

      // 2. Canlı D1 Public API'den Uygulama Verisini Çek
      var apiUrl = (window.SITE_CONFIG && window.SITE_CONFIG.apiUrl) || 'http://localhost:8787/api';
      fetch(apiUrl + '/v1/apps/' + encodeURIComponent(appId))
        .then(function(res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(function(data) {
          if (data && data.app) {
            var raw = data.app;

            // Özellikleri satır satır ayrıştır
            var splitFeatures = function(str) {
              return (str || '').split('\n').map(function(s) { return s.trim(); }).filter(Boolean);
            };
            var featsTr = splitFeatures(raw.features_tr);
            var featsEn = splitFeatures(raw.features_en);
            var featsAr = splitFeatures(raw.features_ar);
            var maxLen = Math.max(featsTr.length, featsEn.length, featsAr.length);
            var combinedFeatures = [];
            for (var i = 0; i < maxLen; i++) {
              combinedFeatures.push({
                tr: featsTr[i] || featsTr[0] || '',
                en: featsEn[i] || featsTr[i] || '',
                ar: featsAr[i] || featsTr[i] || ''
              });
            }

            var rawCats = (raw.category || 'utility').split(',').map(function(s) { return s.trim(); }).filter(Boolean);
            var catLabels = {
              'islamic': { tr: 'İslami / Dinî', en: 'Islamic / Religious', ar: 'إسلامي وديني' },
              'utility': { tr: 'Araçlar & Yardımcılar', en: 'Utilities & Tools', ar: 'أدوات ومساعدات' },
              'productivity': { tr: 'Üretkenlik & Takip', en: 'Productivity & Tracking', ar: 'إنتاجية ومتابعة' },
              'education': { tr: 'Eğitim & İlim', en: 'Education & Knowledge', ar: 'تعليم ومعرفة' },
              'lifestyle': { tr: 'Yaşam & Sağlık', en: 'Lifestyle & Health', ar: 'نمط حياة وصحة' },
              'multimedia': { tr: 'Multimedya & Ses', en: 'Multimedia & Audio', ar: 'وسائط متعددة وصوت' },
              'ai': { tr: 'Yapay Zekâ', en: 'Artificial Intelligence', ar: 'ذكاء اصطناعي' },
              'system': { tr: 'Sistem & Güvenlik', en: 'System & Security', ar: 'نظام وأمان' }
            };
            var catTagline = {
              tr: rawCats.map(function(c) { return catLabels[c] ? catLabels[c].tr : c; }).join(' • ') || 'Araç & Yardımcı',
              en: rawCats.map(function(c) { return catLabels[c] ? catLabels[c].en : c; }).join(' • ') || 'Utility & Tool',
              ar: rawCats.map(function(c) { return catLabels[c] ? catLabels[c].ar : c; }).join(' • ') || 'أدوات ومساعدات'
            };

            var rawIcon = raw.icon_url || (currentApp ? currentApp.icon_url : '');
            if (rawIcon && rawIcon.startsWith('/media/')) {
              rawIcon = 'https://msklabs.org' + rawIcon;
            }

            var cleanId = raw.slug || (raw.app_id ? raw.app_id.replace(/^app_/, '') : appId);

            currentApp = {
              id: cleanId,
              name: { tr: raw.name_tr, en: raw.name_en || raw.name_tr, ar: raw.name_ar || raw.name_tr },
              tagline: catTagline,
              description: { tr: raw.description_tr, en: raw.description_en || raw.description_tr, ar: raw.description_ar || raw.description_tr },
              features: combinedFeatures.length ? combinedFeatures : (currentApp ? currentApp.features : []),
              feature_cards: raw.feature_cards || [],
              version: raw.latest_version || '1.0.0',
              platform: raw.platform || 'all',
              status: raw.status || (raw.is_active ? 'active' : 'in_development'),
              category: raw.category || 'utility',
              downloads_count: raw.downloads_count || 0,
              icon_url: rawIcon,
              permanent_download_url: apiUrl + '/v1/apps/' + cleanId + '/download',
              store_links: raw.store_links || {},
              guide_url: raw.guide_url || raw.manual_url || (raw.store_links && (raw.store_links.guide || raw.store_links.manual)) || '',
              versions: raw.versions || []
            };

            renderApp();
          }
        })
        .catch(function(err) {
          console.warn('[MSK App Detail] Canlı API verisi alınamadı, statik veriyle devam ediliyor:', err.message);
        });
    })();
  </script>
  <!-- Özellik Detay Açılır Balonu (Popover) -->
  <div id="featureCardPopover" class="feature-popover-backdrop" onclick="if(event.target===this) window.closeFeatureCardPopover();">
    <div class="feature-popover-balloon" role="dialog" aria-modal="true">
      <div class="feature-popover-header">
        <div class="feature-popover-header-left">
          <span id="popoverIcon" class="feature-popover-icon">✨</span>
          <h3 id="popoverTitle" class="feature-popover-title">Özellik Başlığı</h3>
        </div>
        <button type="button" class="feature-popover-close" onclick="window.closeFeatureCardPopover()" aria-label="Kapat">✕</button>
      </div>
      <div id="popoverBody" class="feature-popover-body">Özellik detay açıklaması...</div>
    </div>
  </div>

  <script>
    window.openFeatureCardPopover = function(idx) {
      var cards = window._currentCardsData || [];
      var card = cards[idx];
      if (!card) return;

      var activeLang = localStorage.getItem('user_lang') || 'tr';
      function tCard(obj) {
        if (!obj) return '';
        if (typeof obj === 'string') return obj;
        return obj[activeLang] || obj['tr'] || obj['en'] || '';
      }

      var icon = card.icon || '✨';
      var iconEl = document.getElementById('popoverIcon');
      if (iconEl) {
        if (icon.startsWith('<') || icon.startsWith('http')) {
          iconEl.innerHTML = icon.startsWith('<') ? icon : '<img src="' + icon + '" alt="" />';
        } else {
          iconEl.textContent = icon;
        }
      }

      var titleEl = document.getElementById('popoverTitle');
      if (titleEl) {
        titleEl.textContent = tCard({ tr: card.title_tr, en: card.title_en || card.title_tr, ar: card.title_ar || card.title_tr });
      }

      var bodyEl = document.getElementById('popoverBody');
      if (bodyEl) {
        bodyEl.textContent = tCard({ tr: card.description_tr || card.desc_tr, en: card.description_en || card.desc_en || card.description_tr, ar: card.description_ar || card.desc_ar || card.description_tr });
      }

      var popover = document.getElementById('featureCardPopover');
      if (popover) {
        popover.classList.add('active');
        document.body.style.overflow = 'hidden';
      }
    };

    window.closeFeatureCardPopover = function() {
      var popover = document.getElementById('featureCardPopover');
      if (popover) {
        popover.classList.remove('active');
        document.body.style.overflow = '';
      }
    };

    window.scrollToDownloadSection = function(e) {
      if (e) e.preventDefault();
      var target = document.getElementById('download-section');
      if (!target) return;
      var stickyHeader = document.querySelector('.site-header-sticky');
      var headerOffset = stickyHeader ? (stickyHeader.getBoundingClientRect().height + 14) : 130;
      var targetPos = target.getBoundingClientRect().top + window.pageYOffset - headerOffset;

      window.scrollTo({
        top: Math.max(0, targetPos),
        behavior: 'smooth'
      });
    };

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        window.closeFeatureCardPopover();
      }
    });
  </script>
</body>
