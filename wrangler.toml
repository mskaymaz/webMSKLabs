# Cloudflare Worker & D1 / R2 / KV Configuration for webMSKLabs / DevAdmin
name = "uygulamalar"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build"

[[d1_databases]]
binding = "DB"
database_name = "msklabsdesk_db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "msklabsdesk-media"

[[kv_namespaces]]
binding = "IDEMPOTENCY_STORE"
id = "00000000000000000000000000000000"

[vars]
ENVIRONMENT = "development"
ALLOWED_ORIGINS = "http://localhost:3000,http://localhost:5173,https://mskaymaz.com,https://msklabs.org,https://dev.msklabs.org"
