name: TEST-003 CI/CD Quality Gates Pipeline

on:
  push:
    branches: [ DevAdmin, main ]
  pull_request:
    branches: [ DevAdmin, main ]
  workflow_dispatch:

jobs:
  quality_gates:
    name: 5 Quality Gates Validation
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      JWT_SECRET: mock_ci_jwt_secret_32_bytes_long_string!!
      TURNSTILE_SECRET_KEY: mock_turnstile_secret_key

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Quality Gate 1 - TypeScript Compilation Check
        run: npx tsc --noEmit

      - name: Quality Gate 2 - Line Limit Validation (Max 450 lines per file)
        run: npx vitest run tests/test_section15.test.ts

      - name: Quality Gate 3 - i18n Key Consistency Check
        run: npx vitest run tests/section9_i18n_seo.test.ts

      - name: Quality Gate 4 - Vitest Unit Test Suite (Zero-Leak Mocks)
        run: npx vitest run

      - name: Quality Gate 5 - Production Build Check
        run: npx vite build
